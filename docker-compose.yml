services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: telegram_drive_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-telegram_drive}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-telegram_drive}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Node.js Backend (Express + Prisma + GramJS)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: telegram_drive_server
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-telegram_drive}?schema=public
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID}
      TELEGRAM_SESSION_STRING: ${TELEGRAM_SESSION_STRING:-}
      TELEGRAM_UPLOAD_WORKERS: ${TELEGRAM_UPLOAD_WORKERS:-8}
      APP_PASSWORD: ${APP_PASSWORD:-@9525}
      CLIENT_URL: http://localhost:5173
    volumes:
      - ./server:/app
      - /app/node_modules
    command: sh -c "npx prisma generate && npx prisma db push && npm run dev"

  # 3. React Frontend (Vite + Tailwind CSS)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: telegram_drive_client
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - server
    environment:
      VITE_API_URL: http://localhost:3001/api
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --force

volumes:
  postgres_data:
    driver: local
