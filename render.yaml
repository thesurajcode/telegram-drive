services:
  # 1. Backend API (Node.js Express + GramJS MTProto)
  - type: web
    name: telegram-drive-backend
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_UPLOAD_WORKERS
        value: 1
      - key: APP_PASSWORD
        value: "@9525"
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_SESSION_STRING
        value: ""

  # 2. Frontend (Vite + React Static Site)
  - type: web
    name: telegram-drive-frontend
    runtime: static
    rootDir: client
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
